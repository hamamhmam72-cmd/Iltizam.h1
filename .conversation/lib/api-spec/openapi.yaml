openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Ride and delivery requests
  - name: dashboard
    description: Admin and captain dashboard summaries
  - name: finance
    description: Captain commissions and settlements
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List ride and delivery requests
      parameters:
        - in: query
          name: filter
          schema:
            type: string
            enum: [all, today, scheduled, recurring, completed]
            default: all
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a public ride or delivery request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Claim, assign, or complete an order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /dashboard:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the admin dashboard summary
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /captains:
    get:
      operationId: listCaptains
      tags: [finance]
      summary: List captains with financial totals
      responses:
        "200":
          description: Captains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Captain"
  /financials:
    get:
      operationId: getFinancialReport
      tags: [finance]
      summary: Get the captain commission report
      responses:
        "200":
          description: Financial report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialReport"
  /captains/{id}/financial-summary:
    get:
      operationId: getCaptainFinancialSummary
      tags: [finance]
      summary: Get a captain personal financial summary
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Captain financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptainFinancialSummary"
  /captains/{id}/settlements:
    post:
      operationId: createCaptainSettlement
      tags: [finance]
      summary: Settle a captain balance
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementInput"
      responses:
        "201":
          description: Settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlement"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Order:
      type: object
      required: [id, type, customerName, customerPhone, pickup, destination, status, createdAt]
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [ride, delivery]
        customerName: { type: string }
        customerPhone: { type: string }
        pickup: { type: string }
        destination: { type: string }
        scheduledAt: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }
        status:
          type: string
          enum: [pending, claimed, in_progress, completed]
        captainId: { type: ["integer", "null"] }
        captainName: { type: ["string", "null"] }
        commission: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
    OrderInput:
      type: object
      required: [type, customerName, customerPhone, pickup, destination]
      properties:
        type:
          type: string
          enum: [ride, delivery]
        customerName: { type: string, minLength: 2, maxLength: 80 }
        customerPhone:
          type: string
          minLength: 7
          maxLength: 24
          pattern: '^[0-9+()\s-]+$'
        pickup: { type: string, minLength: 2, maxLength: 160 }
        destination: { type: string, minLength: 2, maxLength: 160 }
        scheduledAt: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"], maxLength: 500 }
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [claimed, in_progress, completed]
        captainId: { type: ["integer", "null"], minimum: 1 }
    Captain:
      type: object
      required: [id, name, phone, status, totalTrips, totalCommission, totalPaid, balance]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        status:
          type: string
          enum: [online, offline]
        totalTrips: { type: integer }
        totalCommission: { type: number, format: double }
        totalPaid: { type: number, format: double }
        balance: { type: number, format: double }
    DashboardSummary:
      type: object
      required: [activeOrders, completedToday, totalCaptains, pendingBalance, commissionRate]
      properties:
        activeOrders: { type: integer }
        completedToday: { type: integer }
        totalCaptains: { type: integer }
        pendingBalance: { type: number, format: double }
        commissionRate: { type: number, format: double }
        recentOrders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
    FinancialReport:
      type: object
      required: [commissionRate, totalCompletedTrips, totalAccrued, totalPaid, totalOutstanding, captains]
      properties:
        commissionRate: { type: number, format: double }
        totalCompletedTrips: { type: integer }
        totalAccrued: { type: number, format: double }
        totalPaid: { type: number, format: double }
        totalOutstanding: { type: number, format: double }
        captains:
          type: array
          items: { $ref: "#/components/schemas/Captain" }
    CaptainFinancialSummary:
      type: object
      required: [captain, tripsToday, tripsThisMonth, pendingCommission, recentSettlements]
      properties:
        captain: { $ref: "#/components/schemas/Captain" }
        tripsToday: { type: integer }
        tripsThisMonth: { type: integer }
        pendingCommission: { type: number, format: double }
        recentSettlements:
          type: array
          items: { $ref: "#/components/schemas/Settlement" }
    SettlementInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number, format: double, minimum: 0.01, maximum: 100000 }
        note: { type: ["string", "null"], maxLength: 240 }
    Settlement:
      type: object
      required: [id, captainId, amount, note, settledAt]
      properties:
        id: { type: integer }
        captainId: { type: integer }
        amount: { type: number, format: double }
        note: { type: ["string", "null"] }
        settledAt: { type: string, format: date-time }

